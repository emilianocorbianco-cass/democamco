  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg 16px;line-height:1.5;margin:0;text-wrap:pretty\">I referenti FP CGIL del tuo territorio sono in ogni chat: modulo corretto, indirizzo PEC giusto, checklist passo per passo. Il tuo referente ti accompagna fino alla domanda.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px\"><div style=\"height:4px;background:#201e1d\"><\u002Fdiv><div style=\"height:4px;background:#201e1d\"><\u002Fdiv><div style=\"height:4px;background:#201e1d\"><\u002Fdiv><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ nav.login }}\" style=\"all:unset;box-sizing:border-box;cursor:pointer;border-radius:14px;background:var(--color-accent);color:#fff;font-family:var(--font-heading);font-weight:700;font-size:17px;padding:18px 20px;width:100%;display:flex;justify-content:space-between;align-items:center\" style-hover=\"background:var(--color-accent-600)\">Inizia<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\"><path d=\"M4 12h16M14 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ is.login }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;padding:10px 24px 24px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #201e1d;padding-bottom:14px\">\n        <img src=\"5763e9f6-b7ce-4c5c-9746-5c39f77bec86\" alt=\"FP CGIL\" style=\"height:44px;width:44px\">\n        <div style=\"font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--color-accent-700)\">Accesso<\u002Fdiv>\n      <\u002Fdiv>\n      <h1 style=\"margin:40px 0 0;font-family:var(--font-heading);font-size:38px;font-weight:800;line-height:1.0;letter-spacing:-0.025em;text-wrap:balance\">Entra con la tua identità digitale<\u002Fh1>\n      <p style=\"font-size:16px;line-height:1.5;margin:16px 0 0;color:#4b4640;text-wrap:pretty\">La stessa che usi per Agenzia delle Entrate e sanità. Niente email, niente password: la tua identità è già verificata.<\u002Fp>\n      <div style=\"margin-top:32px;display:flex;flex-direction:column;gap:8px\">\n        <button sc-camel-on-click=\"{{ nav.verify }}\" aria-label=\"Entra con SPID\" style=\"all:unset;box-sizing:border-box;cursor:pointer;border-radius:8px;background:#0066CC;color:#fff;height:56px;padding:0 18px;display:flex;align-items:center;gap:14px;font-family:'Titillium Web',sans-serif;font-size:18px;font-weight:600\" style-hover=\"background:#004d99\"><img src=\"4c5431e3-77ea-4c67-a700-9749102f78ed\" alt=\"\" style=\"width:30px;height:30px;flex:none\"><span style=\"flex:1;border-left:1px solid rgba(255,255,255,0.45);padding-left:14px;line-height:56px\">Entra con SPID<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.verify }}\" aria-label=\"Entra con CIE\" style=\"all:unset;box-sizing:border-box;cursor:pointer;border-radius:8px;background:#0066CC;color:#fff;height:56px;padding:0 18px;display:flex;align-items:center;gap:14px;font-family:'Titillium Web',sans-serif;font-size:18px;font-weight:600\" style-hover=\"background:#004d99\"><img src=\"9c78ad61-166a-446e-96c9-2bb63dd77ea3\" alt=\"\" style=\"width:28px;height:30px;flex:none;object-fit:contain\"><span style=\"flex:1;border-left:1px solid rgba(255,255,255,0.45);padding-left:14px;line-height:56px\">Entra con CIE<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-top:auto;background:var(--color-bg);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start\">\n        <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#ec3013\" stroke-width=\"2\" style=\"flex:none\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#4b4640\">L'accesso restituisce nome, codice fiscale, comparto e sede. L'iscrizione FP CGIL viene verificata in automatico.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ is.verify }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px 64px;background:transparent;color:#201e1d\">\n      <div style=\"width:44px;height:44px;border:4px solid #f6d3cb;border-top-color:#ec3013;border-radius:50%;animation:spin 0.9s linear infinite\"><\u002Fdiv>\n      <h1 style=\"font-family:var(--font-heading);font-size:40px;font-weight:800;margin:28px 0 0;letter-spacing:-0.025em;line-height:1\">Un attimo, Giulia.<\u002Fh1>\n      <p style=\"font-size:17px;margin:14px 0 0;line-height:1.5;border-top:2px solid #201e1d;padding-top:14px;color:#4b4640\">Stiamo verificando la tua iscrizione FP CGIL con i dati della tua identità digitale…<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ is.esito }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column\">\n      <div style=\"background:transparent;color:#201e1d;padding:20px 24px 22px\">\n        <div style=\"width:56px;height:56px;border-radius:16px;background:var(--color-accent);color:#fff;display:flex;align-items:center;justify-content:center\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h1 style=\"font-family:var(--font-heading);font-size:40px;font-weight:800;margin:22px 0 0;line-height:1;letter-spacing:-0.025em\">Sei iscritta, Giulia.<\u002Fh1>\n        <p style=\"font-size:16px;margin:14px 0 0;line-height:1.5;color:#4b4640\">La tua tessera FP CGIL è attiva: hai accesso a tutti i servizi, cambi compensativi compresi.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:22px 24px 24px;flex:1;display:flex;flex-direction:column\">\n        <div style=\"font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#6b6560;margin-bottom:10px\">Dalla tua identità digitale<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#201e1d;border:2px solid #201e1d;border-radius:16px;overflow:hidden;font-size:14px\">\n          <div style=\"background:#fff;padding:12px 14px\"><div style=\"color:#6b6560;font-size:12px;margin-bottom:3px\">Nome<\u002Fdiv><strong>Giulia Fontana<\u002Fstrong><\u002Fdiv>\n          <div style=\"background:#fff;padding:12px 14px\"><div style=\"color:#6b6560;font-size:12px;margin-bottom:3px\">Codice fiscale<\u002Fdiv><strong>FNTGLI84•••••••••<\u002Fstrong><\u002Fdiv>\n          <div style=\"background:#fff;padding:12px 14px\"><div style=\"color:#6b6560;font-size:12px;margin-bottom:3px\">Comparto<\u002Fdiv><strong>Sanità<\u002Fstrong><\u002Fdiv>\n          <div style=\"background:#fff;padding:12px 14px\"><div style=\"color:#6b6560;font-size:12px;margin-bottom:3px\">Sede<\u002Fdiv><strong>Osp. Belcolle, Viterbo<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ nav.home }}\" style=\"all:unset;box-sizing:border-box;cursor:pointer;border-radius:14px;background:var(--color-accent);color:#fff;font-family:var(--font-heading);font-weight:700;font-size:17px;padding:18px 20px;width:100%;margin-top:auto;display:flex;justify-content:space-between;align-items:center\" style-hover=\"background:var(--color-accent-600)\">Vai alla Home<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\"><path d=\"M4 12h16M14 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <p style=\"font-size:12.5px;color:#6b6560;margin:12px 0 0;line-height:1.5\">Non risulti iscritto? Ti proponiamo due strade: iscrizione a FP CGIL (consigliata) o abbonamento al solo servizio cambi — quota per la tua categoria. <button sc-camel-on-click=\"{{ nav.b1 }}\" style=\"all:unset;cursor:pointer;color:var(--color-accent-700);font-weight:700;text-decoration:underline\">Guarda il caso di Marco →<\u002Fbutton><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ is.home }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;background:var(--color-bg)\">\n      <div style=\"background:transparent;color:#201e1d;padding:8px 20px 22px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between\">\n          <img src=\"5763e9f6-b7ce-4c5c-9746-5c39f77bec86\" alt=\"FP CGIL\" style=\"height:40px;width:40px\">\n          <div style=\"font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#6b6560\">Cambi compensativi<\u002Fdiv>\n        <\u002Fdiv>\n        <h1 style=\"margin:24px 0 0;font-family:var(--font-heading);font-size:48px;font-weight:800;line-height:0.95;letter-spacing:-0.03em\">Ciao Giulia.<\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"padding:14px 14px 20px;display:flex;flex-direction:column;gap:10px\">\n        <sc-if value=\"{{ notPublished }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:#fff;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-accent-700)\">Il primo passo<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-0.015em\">Racconta all'app il tuo cambio ideale.<\u002Fdiv>\n            <p style=\"font-size:15px;line-height:1.5;color:#4b4640;margin:0 0 6px\">Sede, ruolo e destinazione: 2 minuti. Poi ci pensiamo noi a cercare chi fa il percorso inverso.<\u002Fp>\n            <button sc-camel-on-click=\"{{ nav.c1 }}\" style=\"all:unset;box-sizing:border-box;cursor:pointer;border-radius:14px;background:var(--color-accent);color:#fff;font-family:var(--font-heading);font-weight:700;font-size:16px;padding:16px 18px;width:100%;display:flex;justify-content:space-between;align-items:center\" style-hover=\"background:var(--color-accent-600)\">Compila la scheda cambi<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\"><path d=\"M4 12h16M14 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ published }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ nav.c5 }}\" style=\"cursor:pointer;border-radius:18px;background:#fff;padding:18px 20px\" style-hover=\"background:#fdf1ef\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center\">\n              <div style=\"font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#6b6560\">La tua richiesta<\u002Fdiv>\n              <span style=\"background:#1a7a3a;color:#fff;font-family:var(--font-heading);font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px\">Attiva<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-size:26px;font-weight:800;margin-top:10px;letter-spacing:-0.02em;line-height:1.05\">Viterbo → Rieti <span style=\"font-weight:500;font-size:14px;color:#6b6560;letter-spacing:0\">· entro {{ raggio }} km<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#6b6560;margin-top:8px;border-top:2px solid #e4e0da;padding-top:8px\">Infermiere DEP1 · tocca per stato e modifiche<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ nav.match }}\" style=\"cursor:pointer;border-radius:18px;background:#fff;padding:16px 20px;display:grid;grid-template-columns:40px 1fr 20px;gap:14px;align-items:start\" style-hover=\"background:#fdf1ef\">\n            <div style=\"width:40px;height:40px;border-radius:12px;background:var(--color-accent);color:#fff;display:flex;align-items:center;justify-content:center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\"><path d=\"M3 8h16M15 4l4 4-4 4M21 16H5M9 12l-4 4 4 4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div>\n              <div style=\"font-family:var(--font-heading);font-size:10.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-accent-700)\">Match trovato · a due<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading);font-size:17px;font-weight:800;margin-top:5px;line-height:1.2\">Qualcuno da Rieti vuole venire a Viterbo.<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#6b6560;margin-top:4px\">Stesso ruolo, direzioni speculari. Tocca per vedere.<\u002Fdiv>\n            <\u002Fdiv>\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2.25\"><path d=\"M7 17 17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ nav.tri }}\" style=\"cursor:pointer;border-radius:18px;background:#fff;padding:16px 20px;display:grid;grid-template-columns:40px 1fr 20px;gap:14px;align-items:start\" style-hover=\"background:#fdf1ef\">\n            <div style=\"width:40px;height:40px;border-radius:12px;background:#201e1d;color:#fff;display:flex;align-items:center;justify-content:center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\"><path d=\"M12 3 21 19H3z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div>\n              <div style=\"font-family:var(--font-heading);font-size:10.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-accent-700)\">Cambio a tre · nuova proposta<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading);font-size:17px;font-weight:800;margin-top:5px;line-height:1.2\">Viterbo → Rieti → Latina → Viterbo<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#6b6560;margin-top:4px\">Un cerchio che si chiude. Conferma entro <strong style=\"color:#201e1d;font-variant-numeric:tabular-nums\">{{ cd }}<\u002Fstrong>.<\u002Fdiv>\n            <\u002Fdiv>\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2.25\"><path d=\"M7 17 17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ nav.incompleto }}\" style=\"cursor:pointer;border-radius:18px;background:#fff;border:2px dashed var(--color-accent);padding:16px 20px;display:grid;grid-template-columns:40px 1fr 20px;gap:14px;align-items:start\" style-hover=\"background:#fdf1ef\">\n            <div style=\"width:40px;height:40px;border-radius:12px;border:2px dashed var(--color-accent);box-sizing:border-box;color:var(--color-accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:18px\">?<\u002Fdiv>\n            <div>\n              <div style=\"font-family:var(--font-heading);font-size:10.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-accent-700)\">Triangolo incompleto<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading);font-size:17px;font-weight:800;margin-top:5px;line-height:1.2\">Manca una persona da Rieti a Latina.<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#6b6560;margin-top:4px\">Conosci un collega? Invitalo e chiudi il cerchio.<\u002Fdiv>\n            <\u002Fdiv>\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2.25\"><path d=\"M7 17 17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg>\n          <\u gap:10px;font-size:13px;color:#6b6560;margin-bottom:8px\"><span>Distanza dalla tua destinazione<\u002Fspan><strong style=\"color:#1a7a3a;text-align:right\">0 km — dentro il tuo raggio di {{ raggio }} km<\u002Fstrong><\u002Fdiv>\n          <div style=\"height:8px;border-radius:99px;overflow:hidden;background:#e4e0da;position:relative\"><div style=\"position:absolute;left:0;top:0;bottom:0;width:6px;background:#1a7a3a\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:auto;padding:16px 24px 24px;display:flex;flex-direction:column;gap:8px\">\n        <button sc-camel-on-click=\"{{ nav.chat }}\" style=\"all:unset;box-sizing:border-box;cursor:pointer;border-radius:14px;background:var(--color-accent);color:#fff;font-family:var(--font-heading);font-weight:700;font-size:17px;padding:18px 20px;width:100%;display:flex;justify-content:space-between;align-items:center\" style-hover=\"background:var(--color-accent-600)\">Mi interessa → apri la chat<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.home }}\" style=\"all:unset;box-sizing:border-box;cursor:pointer;border-radius:14px;border:2px solid #201e1d;color:#201e1d;font-family:var(--font-heading);font-weight:700;font-size:16px;padding:14px 18px;width:100%\" style-hover=\"background:#e4e0da\">Non ora — senza penalità<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ is.chat }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;min-height:0\">\n      <div style=\"padding:6px 20px 12px;border-bottom:2px solid #201e1d;background:#fff\">\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center\">\n          <button sc-camel-on-click=\"{{ n 00;font-size:14px;padding:12px 14px;width:100%;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center\" style-hover=\"background:#3a3733\">Guida alla domanda di mobilità →<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\"><path d=\"M14 2H6v20h12V6z\"><\u002Fpath><path d=\"M14 2v4h4M8 13h8M8 17h5\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <div style=\"display:flex;gap:6px\">\n          <input value=\"{{ chatInput }}\" sc-camel-on-change=\"{{ onChatInput }}\" placeholder=\"Scrivi un messaggio…\" style=\"flex:1;border:none;border-radius:14px;padding:12px 14px;font-size:15px;font-family:inherit;background:var(--color-bg);outline:none\">\n          <button sc-camel-on-click=\"{{ sendChat }}\" style=\"all:unset;box-sizing:border-box;cursor:pointer;border-radius:14px;background:var(--color-accent);color:#fff;width:48px;display:flex;align-items:center;justify-content:center\" style-hover=\"background:var(--color-accent-600)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\"><path d=\"M4 12h16M14 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ is.pec }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;padding:6px 24px 24px;overflow-y:auto\">\n      <button sc-camel-on-click=\"{{ nav.chat }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--color-accent-700);font-weight:700;align-self:flex-start;display:flex;gap:6px;align-items:center\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M20 12H4M10 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>Torna alla chat<\u002Fbutton>\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-top:16px\">\n        <div style=\"font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--color-accent-700)\">Guida alla domanda · {{ pecCount }} di 5<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:4px;background:#e4e0da;margin-top:8px;position:relative\"><div style=\"position:absolute;left:0;top:0;bottom:0;width:{{ pecPct }};background:var(--color-accent);transition:width .3s\"><\u002Fdiv><\u002Fdiv>\n      <h1 style=\"font-family:var(--font-heading);font-size:30px;font-weight:800;margin:14px 0 8px;line-height:1.02;letter-spacing:-0.025em\">La domanda di mobilità, passo per passo<\u002Fh1>\n      <p style=\"font-size:14.5px;color:#4b4640;margin:0 0 14px;line-height:1.5\">Si invia via PEC alla tua amministrazione — vale anche per i trasferimenti interni. Luca ti segue in chat a ogni passo.<\u002Fp>\n      <div style=\"border-top:2px solid #201e1d\">\n        <label style=\"padding:13px 0;display:grid;grid-template-columns:34px 1fr 24px;gap:10px;align-items:start;cursor:pointer;border-bottom:2px solid #e4e0da\"><span style=\"font-family:var(--font-heading);font-weight:800;font-size:18px;color:var(--color-accent)\">01<\u002Fspan><span style=\"font-size:15px;line-height:1.45\"><strong>Scarica il modulo corretto<\u002Fstrong><br><span style=\"font-size:13px;color:#6b6560\">Domanda di mobilità volontaria — ASL Viterbo, comparto sanità.<\u002Fspan><br><span style=\"display:inline-flex;gap:6px;align-items:center;margin-top:8px;background:#201e1d;color:#fff;border-radius:8px;font-family:var(--font-heading);font-size:12px;font-weight:700;padding:7px 10px\">↓ Modulo_mobilita_ASL-VT.pdf<\u002Fspan><\u002Fspan><input type=\"checkbox\" checked=\"{{ p1 }}\" sc-camel-on-change=\"{{ tp1 }}\" style=\"margin-top:1px\"><\u002Flabel>\n        <label style=\"padding:13px 0;display:grid;grid-template-columns:34px 1fr 24px;gap:10px;align-items:start;cursor:pointer;border-bottom:2px solid #e4e0da\"><span style=\"font-family:var(--font-heading);font-weight:800;font-size:18px;color:var(--color-accent)\">02<\u002Fspan><span style=\"font-size:15px;line-height:1.45\"><strong>Compila con i dati del cambio<\u002Fstrong><br><span style=\"font-size:13px;color:#6b6560\">Sede attuale, sede richiesta, riferimento al cambio compensativo.<\u002Fspan><\u002Fspan><input type=\"checkbox\" checked=\"{{ p2 }}\" sc-camel-on-change=\"{{ tp2 }}\" style=\"margin-top:1px\"><\u002Flabel>\n        <label style=\"padding:13px 0;display:grid;grid-template-columns:34px 1fr 24px;gap:10px;align-items:start;cursor:pointer;border-bottom:2px solid #e4e0da\"><span style=\"font-family:var(--font-heading);font-weight:800;font-size:18px;color:var(--color-accent)\">03<\u002Fspan><span style=\"font-size:15px;line-height:1.45\"><strong>Allega il documento d'identità<\u002Fstrong><\u002Fspan><input type=\"checkbox\" checked=\"{{ p3 }}\" sc-camel-on-change=\"{{ tp3 }}\" style=\"margin-top:1px\"><\u002Flabel>\n        <label style=\"padding:13px 0;display:grid;grid-template-columns:34px 1fr 24px;gap:10px;align-items:start;cursor:pointer;border-bottom:2px solid #e4e0da\"><span style=\"font-family:var(--font-heading);font-weight:800;font-size:18px;color:var(--color-accent)\">04<\u002Fspan><span style=\"font-size:15px;line-height:1.45\"><strong>Invia alla PEC giusta<\u002Fstrong><br><span style=\"font-size:13px;color:#6b6560\">protocollo@pec.asl.vt.it<\u002Fspan> <button sc-camel-on-click=\"{{ copyPec }}\" style=\"all:unset;cursor:pointer;font-size:12px;font-weight:700;color:var(--color-accent-700);text-decoration:underline;margin-left:6px\">{{ copyLabel }}<\u002Fbutton><\u002Fspan><input type=\"checkbox\" checked=\"{{ p4 }}\" sc-camel-on-change=\"{{ tp4 }}\" style=\"margin-top:1px\"><\u002Flabel>\n        <label style=\"padding:13px 0;display:grid;grid-template-columns:34px 1fr 24px;gap:10px;align-items:start;cursor:pointer;border-bottom:2px solid #201e1d\"><span style=\"font-family:var(--font-heading);font-weight:800;font-size:18px;color:var(--color-accent)\">05<\u002Fspan><span style=\"font-size:15px;line-height:1.45\"><strong>Conserva la ricevuta di consegna<\u002Fstrong><br><span style=\"font-size:13px;color:#6b6560\">Arriva via PEC entro pochi minuti: fa data certa.<\u002Fspan><\u002Fspan><input type=\"checkbox\" checked=\"{{ p5 }}\" sc-camel-on-change=\"{{ tp5 }}\" style=\"margin-top:1px\"><\u002Flabel>\n      <\u002Fdiv>\n      <p style=\"font-size:13px;color:#6b6560;margin:14px 0 0;line-height:1.5\">Anche Marco riceve la stessa guida per l'ASL di Rieti. Le due domande viaggiano in parallelo.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ is.tri }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;overflow-y:auto\">\n      <div style=\"padding:10px 24px 0\">\n        <div style=\"font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--color-accent-700)\">Cambio a tre<\u002Fdiv>\n        <h1 style=\"font-family:var(--font-heading);font-size:30px;font-weight:800;margin:10px 0 4px;line-height:1.02;letter-spacing:-0.025em;text-wrap:balance\">Non serve la persona giusta. Basta chiudere il cerchio.<\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"padding:0 24px\">\n        <svg sc-camel-view-box=\"0 0 340 200\" style=\"width:100%;flex:none;margin:8px 0\">\n          <path d=\"M 170 40 L 84 150\" stroke=\"#201e1d\" stroke-width=\"2\" fill=\"none\"><\u002Fpath><polygon points=\"84,152 95,144 87,138\" fill=\"#201e1d\"><\u002Fpolygon>\n          <path d=\"M 88 164 L 252 164\" stroke=\"#201e1d\" stroke-width=\"2\" fill=\"none\"><\u002Fpath><polygon points=\"256,164 245,158 245,170\" fill=\"#201e1d\"><\u002Fpolygon>\n          <path d=\"M 256 150 L 172 36\" stroke=\"#201e1d\" stroke-width=\"2\" fill=\"none\"><\u002Fpath><polygon points=\"170,32 172,45 181,39\" fill=\"#201e1d\"><\u002Fpolygon>\n          <rect x=\"152\" y=\"6\" width=\"36\" height=\"36\" fill=\ n      sendChat: () => { const t = this.state.chatInput.trim(); if (!t) return; this.setState({ chatMsgs: [...this.state.chatMsgs, { me: true, text: t }], chatInput: '' }); setTimeout(() => this.setState({ chatMsgs: [...this.state.chatMsgs, { who: 'Marco R. \\u00b7 Rieti', text: 'Perfetto. Io intanto scarico il modulo per l\\u2019ASL di Rieti, cos\\u00ec partiamo insieme.' }] }), 1400); },\n      triMsgs: this.msgView(s.triMsgs), triInput: s.triInput, onTriInput: (e) => this.setState({ triInput: e.target.value }),\n      sendTri: () => { const t = this.state.triInput.trim(); if (!t) return; this.setState({ triMsgs: [...this.state.triMsgs, { me: true, text: t }], triInput: '' }); },\n      marcoMsgs: this.msgView(s.marcoMsgs), marcoInput: s.marcoInput, onMarcoInput: (e) => this.setState({ marcoInput: e.target.value }),\n      sendMarco: () => { const t = this.state.marcoInput.trim(); if (!t) return; this.setState({ marcoMsgs: [...this.state.marcoMsgs, { me: true, text: t }], marcoInput: '' }); setTimeout(() => this.setState({ marcoMsgs: [...this.state.marcoMsgs, { who: 'Antonio Minetola \\u00b7 Napoli', text: 'Perfetto. Appena Paola ci manda il modulo, io parto subito con la mia domanda.' }] }), 1400); },\n      payApple: () => this.setState({ subPay: 'apple' }), payGoogle: () => this.setState({ subPay: 'google' }), payCarta: () => this.setState({ subPay: 'carta' }),\n      payAppleBg: s.subPay === 'apple' ? '#201e1d' : '#fff', payAppleColor: s.subPay === 'apple' ? '#fff' : '#201e1d',\n      payGoogleBg: s.subPay === 'google' ? '#201e1d' : '#fff', gpayTextFill: s.subPay === 'google' ? '#fff' : '#5f6368',\n      payCartaBg: s.subPay === 'carta' ? '#201e1d' : '#fff', payCartaColor: s.subPay === 'carta' ? '#fff' : '#201e1d',\n      triMeLabel: s.triMe ? 'Accettato ✓' : 'In attesa di te', triMeColor: s.triMe ? '#1a7a3a' : '#b3200c',\n      triDavLabel: s.triDav ? 'Accettato ✓' : 'In attesa', triDavColor: s.triDav ? '#1a7a3a' : '#6b6560',\n      triNotMine: !s.triMe, triA
